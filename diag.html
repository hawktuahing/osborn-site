<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Osborn — intro bisect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0A0A;color:#F4F3F0;font:13px/1.45 ui-monospace,Menlo,monospace}
#stage{position:relative;overflow:hidden;height:60vh;background:linear-gradient(#F3F3F5,#EEEEEF)}
#stage video{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);width:100%;
  height:var(--vh,100%);object-fit:cover;object-position:center;transition:height 1.1s cubic-bezier(.22,.8,.2,1)}
body.plain #stage{height:34vh;background:#111}
body.plain #stage video{position:static;transform:none;height:100%;object-fit:contain;transition:none}
#glass{position:absolute;top:12px;right:12px;z-index:3;display:flex;gap:8px}
#glass span{color:#fff;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:10px 15px;border-radius:999px;
  background:rgba(10,10,10,.28);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);
  border:1px solid rgba(255,255,255,.22)}
body.noglass #glass{display:none}
#panel{padding:12px calc(12px + env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom))}
label{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:14px}
input[type=checkbox]{width:20px;height:20px}
button{font:inherit;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:#F4F3F0;color:#0A0A0A;
  border:0;border-radius:3px;padding:15px;width:100%;margin:10px 0}
#sum{padding:10px;border:1px solid #2a2a2a;border-radius:3px;background:#141414;margin-bottom:10px;font-size:14px}
#log{white-space:pre-wrap;word-break:break-word;background:#141414;border:1px solid #2a2a2a;border-radius:3px;padding:9px;font-size:12px;min-height:120px}
.hit{color:#ff6b6b;font-weight:700}.ok{color:#7ddf85}
h1{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#8f8c81;margin-bottom:6px}
</style></head><body>
<div id="stage">
  <video id="v" muted playsinline webkit-playsinline preload="none"></video>
  <div id="glass"><span>skip</span><span>&#9208;</span></div>
</div>
<div id="panel">
  <h1>Intro bisect — turn things off until the restart stops</h1>
  <label><input type="checkbox" id="cPoster" checked> poster (clip's first frame)</label>
  <label><input type="checkbox" id="cStage" checked> full-bleed cover box + height transition</label>
  <label><input type="checkbox" id="cGlass" checked> glass buttons over the clip (backdrop-filter)</label>
  <label><input type="checkbox" id="cBlob"> feed it as a blob: URL (the old way)</label>
  <button id="go">Run</button>
  <div id="sum">idle</div>
  <div id="log"></div>
</div>
<script>
(function(){
  var v=document.getElementById('v'), log=document.getElementById('log'), sum=document.getElementById('sum');
  var t0=0, last=-1, back=0, lines=[], firstPaint=null, painted=0;
  function st(){ return String(Math.round(performance.now()-t0)).padStart(5,' ')+'ms'; }
  function say(s,c){ lines.push('<span'+(c?' class="'+c+'"':'')+'>'+st()+'  '+s+'</span>'); log.innerHTML=lines.join('\n'); }
  ['loadstart','loadedmetadata','loadeddata','canplay','play','playing','pause','waiting','stalled',
   'suspend','seeking','seeked','emptied','abort','error','ended']
   .forEach(function(n){ v.addEventListener(n,function(){ say(n+'  t='+v.currentTime.toFixed(3)+' rs='+v.readyState); }); });

  /* the real test: sample what is actually on screen. If the picture goes back to
     the opening frame while currentTime keeps going, that is the restart. */
  var cv=document.createElement('canvas'); cv.width=48; cv.height=85; var cx=cv.getContext('2d');
  var ref=null;
  function sig(){
    try{ cx.drawImage(v,0,0,48,85); }catch(e){ return null; }
    var d=cx.getImageData(0,0,48,85).data, out=[];
    for(var i=0;i<d.length;i+=4*17) out.push(d[i]);
    return out;
  }
  function diff(a,b){ if(!a||!b) return 999; var s=0; for(var i=0;i<a.length;i++) s+=Math.abs(a[i]-b[i]); return s/a.length; }

  function watch(){
    if(v.currentTime < last-0.02){ back++; say('TIME WENT BACK '+last.toFixed(3)+' -> '+v.currentTime.toFixed(3),'hit'); }
    last=v.currentTime;
    var s=sig();
    if(s){
      if(!ref && v.currentTime>0.01){ ref=s; }
      else if(ref && v.currentTime>0.45 && diff(s,ref)<3){
        painted++; say('PICTURE BACK AT FRAME 0  (currentTime is '+v.currentTime.toFixed(3)+')','hit'); ref=null;
      }
    }
    sum.innerHTML='t='+v.currentTime.toFixed(2)+'s rate='+v.playbackRate.toFixed(2)+
      '<br>time jumps: <b class="'+(back?'hit':'ok')+'">'+back+'</b>'+
      ' &nbsp; picture resets: <b class="'+(painted?'hit':'ok')+'">'+painted+'</b>';
    if(!v.ended) requestAnimationFrame(watch);
  }

  document.getElementById('go').addEventListener('click',function(){
    var poster=document.getElementById('cPoster').checked,
        stage=document.getElementById('cStage').checked,
        glass=document.getElementById('cGlass').checked,
        blob=document.getElementById('cBlob').checked;
    document.body.classList.toggle('plain',!stage);
    document.body.classList.toggle('noglass',!glass);
    lines=[]; back=0; painted=0; last=-1; ref=null; t0=performance.now();
    var m=matchMedia('(max-width:834px)').matches;
    var url=m?'assets/m/intro.mp4':'assets/d/intro.mp4';
    var post=m?'assets/m/intro-poster.jpg':'assets/d/intro-poster.jpg';
    say('poster='+poster+' stage='+stage+' glass='+glass+' blob='+blob);
    v.removeAttribute('poster'); if(poster) v.poster=post;
    fetch(url).then(function(res){
      var got=0,chunks=[],rd=res.body.getReader();
      return (function pump(){ return rd.read().then(function(r){
        if(r.done) return blob?new Blob(chunks,{type:'video/mp4'}):null;
        got+=r.value.length; if(blob) chunks.push(r.value); return pump(); }); })();
    }).then(function(b){
      say('downloaded; handing over');
      v.preload='auto'; v.src = b ? URL.createObjectURL(b) : url; v.load();
      setTimeout(function(){
        v.playbackRate=0.35;
        var p=v.play(); if(p&&p.catch) p.catch(function(e){ say('play() rejected '+e,'hit'); });
        var i=0, iv=setInterval(function(){ i++; if(i>=8){clearInterval(iv);v.playbackRate=1;return;}
          v.playbackRate=0.35+(1-Math.pow(1-i/8,3))*0.65; },88);
        requestAnimationFrame(watch);
      },260);
    }).catch(function(e){ say('fetch failed '+e,'hit'); });
  });
})();
</script></body></html>
